name: Drive Video to MP3 Bot

on:
  schedule:
    - cron: '*/30 * * * *' # Yeh har 30 minute mein khud chalega
  workflow_dispatch:      # Isse aap jab chahein "Run" button daba kar chala sakte hain

concurrency:
  group: mp3-bot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        run: python main.py --once
